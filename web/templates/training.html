{% extends "base.html" %}
{% block content %}
<h1>{{ title }}</h1>
<form class="row" method="post" action="/trainings/{{ training.id }}/date">
    <input type="date" name="day" value="{{ training.date }}" required>
    <button>Изменить дату</button>
</form>

<!-- таблица подходов -->
<div class="card">
    <table>
        <tr><th>Упражнение</th><th>Вес</th><th>Повторения</th><th></th></tr>
        {% for row in rows %}
        <tr>
            <td>{{ row.name }}</td>
            <td>{{ row.weight }}</td>
            <td>{{ row.reps }}</td>
            <td>
                <form method="post" action="/trainings/{{ training.id }}/exercises/{{ row.id }}/delete">
                    <button class="link danger">Удалить</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="muted">Подходов пока нет.</td></tr>
        {% endfor %}
    </table>
</div>

<!-- новое упражнение -->
<h3 class="section">Новое упражнение</h3>
<div class="card">
    <form method="get">
        <select name="exercise" onchange="this.form.submit()">
            <option value="">Выберите упражнение</option>
            {% for group, items in groups.items() %}
            <optgroup label="{{ group }}">
                {% for info in items %}
                <option value="{{ info.id }}" {% if info.id == selected %}selected{% endif %}>{{ info.name }}</option>
                {% endfor %}
            </optgroup>
            {% endfor %}
        </select>
    </form>
    <form class="row" method="post" action="/trainings/{{ training.id }}/exercises">
        <input type="hidden" name="exercise" value="{{ selected }}">
        <label>Вес <input type="number" name="weight" value="{{ weight }}" min="0" max="1000" step="any"></label>
        <label>Повторения <input type="number" name="reps" value="{{ reps }}" min="1" max="1000"></label>
        <button class="primary">Добавить</button>
    </form>
    <p class="muted">{{ hint }}</p>
</div>

<!-- удаление тренировки -->
<form method="post" action="/trainings/{{ training.id }}/delete" onsubmit="return confirm('Удалить эту тренировку?')">
    <button class="danger">Удалить тренировку</button>
</form>
{% endblock %}
