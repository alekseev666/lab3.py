# база PostgreSQL и веб-версия
services:
  # база данных
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    # ждём, пока база проснётся
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 3s
      timeout: 3s
      retries: 10

  # сайт на FastAPI
  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://tracker:tracker@db:5432/tracker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

# данные базы между запусками
volumes:
  db_data:
